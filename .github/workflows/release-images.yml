name: Release verified container images

on:
  workflow_call:
    inputs:
      source_tag:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-hets-images
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Require trusted workflow
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote existing digests and create GitHub release
        run: node .github/scripts/release-images.mjs "$SOURCE_TAG" "$RELEASE_TAG"
